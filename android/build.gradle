buildscript {
  repositories {
    google()
    mavenCentral()
    mavenLocal()
  }
  dependencies {
    classpath "com.android.tools.build:gradle:9.2.1"
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.3.20"
    classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:2.3.20"
  }
}

apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "org.jetbrains.kotlin.plugin.compose"

android {
  namespace "com.mapconductor.react.tomtom"

  compileSdk = rootProject.ext.has("compileSdkVersion") ? rootProject.ext.compileSdkVersion : 35

  defaultConfig {
    minSdk = rootProject.ext.has("minSdkVersion") ? rootProject.ext.minSdkVersion : 24
    // TomTom Orbis SDK 2.x はプロダクトフレーバー次元 "tomtom-sdk-version" を持つ。
    // 解決してやらないと依存が引けない（complete = オンライン地図表示）。
    // android-sdk の android-for-tomtom / example-app と同じ指定。
    missingDimensionStrategy("tomtom-sdk-version", "complete")
  }

  buildFeatures {
    compose true
  }

  sourceSets {
    main {
      java.srcDirs += ["src/main/java"]
    }
  }
}

repositories {
  mavenLocal()
  google()
  mavenCentral()
  // TomTom Orbis Maps Display SDK はここでしか配られていない。
  maven { url "https://repositories.tomtom.com/artifactory/maven" }
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation platform("androidx.compose:compose-bom:2025.02.00")
  implementation "androidx.compose.ui:ui"
  implementation "androidx.compose.foundation:foundation"
  implementation project(":mapconductor_js-sdk-react")
  api("com.mapconductor:core:1.3.1")
  api("com.mapconductor:compose:1.3.1")
  api("com.mapconductor:for-tomtom:1.3.1")
}
